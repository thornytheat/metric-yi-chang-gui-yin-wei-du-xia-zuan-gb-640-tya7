<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}指标异常归因{% endblock %}</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/layout.css">
<link rel="stylesheet" href="/static/components.css">
<script src="/static/timeline.js" defer></script>
<script src="/static/table.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">蓝湾·经营分析<span class="sub">anomalyattr</span></div>
  <nav class="tabs">
    {% for href, label, key in nav %}<a href="{{ href }}"{% if key == active %} class="on"{% endif %}>{{ label }}</a>{% endfor %}
  </nav>
  <div class="runline">批次 <b>{{ run.run_id if run else "—" }}</b> · 版本 {{ watermark or "—" }} · 生成 {{ created_at or "—" }} · {{ tz_label }}</div>
</header>
<div class="rail">
  <div class="axis" data-kind="{{ axis_kind|default('date') }}"></div>
  <script type="application/json" class="axis-data">{{ (axis or {})|tojson }}</script>
</div>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
